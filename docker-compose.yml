version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    ports:
      - "50051:50051"
    environment:
      RUST_LOG: info
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "mcp.MCP/Health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_SERVICE_PORT: 8000
      GRPC_SERVER_URL: mcp-server:50051
      RUST_LOG: info
    # Install language runtimes and tools for Phase 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /tmp:/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
