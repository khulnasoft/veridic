name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Build Rust
        run: cd mcp-server && cargo build --release
      - name: Run Rust tests
        run: cd mcp-server && cargo test

  python-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r ai-service/requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 ai-service/src --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Python tests
        run: cd tests && python -m pytest -v || true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker images
        run: docker-compose build

  integration-tests:
    runs-on: ubuntu-latest
    needs: [rust-build, python-build, docker-build]
    steps:
      - uses: actions/checkout@v3
      - name: Start services
        run: docker-compose up -d
      - name: Wait for services
        run: sleep 10
      - name: Test Rust gRPC health
        run: |
          cd tests && python3 test_integration.py || true
      - name: Stop services
        run: docker-compose down
